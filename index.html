<!doctype html>
<html lang='tr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'>
<title>Avcular Çiftliği • Buzağı Takip</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--navy:#123f72;--green:#15705a;--bg:#f4f7f8;--text:#17212b;--muted:#77838c;--line:#e1e7ea;--shadow:0 10px 28px rgba(18,63,114,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;position:relative}
.hero{padding:22px 20px 28px;color:#fff;background:#123f72;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;gap:13px}
.brand h1{margin:0;font-size:24px;letter-spacing:-.7px}.brand p{margin:5px 0 0;opacity:.82;font-size:13px}
.page{display:none;padding:22px 18px 92px}.page.active{display:block}h2{font-size:24px;margin:2px 0 16px;letter-spacing:-.5px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.home-card{border:1px solid var(--line);background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);padding:18px 16px;text-align:left;cursor:pointer}
.home-card:active{transform:scale(.985)}
.inside b{font-size:17px;color:var(--navy);display:block}.inside span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.summary{margin-top:27px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5f7f8;border-radius:18px;padding:15px 5px;text-align:center}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:11px;color:var(--muted)}
.topbar{display:flex;gap:9px;margin-bottom:16px}.back{border:0;background:#edf2f4;color:var(--navy);border-radius:12px;padding:11px 13px;font-weight:800}.add{border:0;background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;flex:1}.add.green{background:var(--green)}
.filter{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-bottom:12px}
.form{display:none;background:#f6f8f9;border:1px solid var(--line);padding:15px;border-radius:19px;margin-bottom:15px}.form.show{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:0 0 5px}
input,select,textarea{width:100%;border:1px solid #dce3e7;border-radius:11px;padding:12px;background:#fff;outline:none}
.primary{width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px;font-weight:800}.primary.green{background:var(--green)}
.list{display:grid;gap:12px}.empty{padding:25px 10px;text-align:center;color:var(--muted);background:#f7f9fa;border-radius:17px}
.animal{border:1px solid var(--line);border-radius:20px;padding:15px;background:#fff;box-shadow:0 7px 22px rgba(0,0,0,.05)}
.animal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.animal-title{font-weight:800;font-size:17px;color:var(--navy)}.badge{font-size:11px;background:#eef3f6;color:#52616d;border-radius:999px;padding:5px 8px;font-weight:700}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{background:#f7f9fa;border-radius:12px;padding:9px}.detail small{display:block;color:var(--muted);font-size:10px}.detail b{display:block;margin-top:2px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:0;border-radius:11px;padding:10px;font-weight:800;font-size:11px}
.move{background:#eaf5f0;color:var(--green)}.danger{background:#fbeaea;color:#a52a2a}.btn-act{background:#edf2f7;color:var(--navy)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:10px 15px;gap:8px;z-index:20}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:12px;font-size:12px;font-weight:800}.nav button.active{background:#edf5f2;color:var(--green)}
.modal{display:none;position:fixed;inset:0;background:rgba(12,25,35,.58);z-index:50;padding:18px;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{width:min(520px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.close{border:0;background:#eef2f4;border-radius:50%;width:38px;height:38px;font-size:20px}
.sync-badge{position:absolute;top:15px;right:15px;font-size:10px;font-weight:800;background:#e6f5ee;color:#147052;padding:4px 8px;border-radius:99px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header class="hero">
  <div id="sync-status" class="sync-badge">🟢 Bulut Bağlı</div>
  <div class="brand">
    <div><h1>Avcular Çiftliği</h1><p>Bulut Tabanlı Buzağı Takip</p></div>
  </div>
</header>

<main>
  <!-- ANA SAYFA -->
  <section id="home" class="page active">
    <h2>Bölüm Seç</h2>
    <div class="home-grid">
      <div class="home-card" onclick="openSection('bolme')">
        <div class="inside"><b>🏠 Bireysel Bölmeler</b><span id="cnt-bolme">0 Buzağı</span></div>
      </div>
      <div class="home-card" onclick="openSection('kulube')">
        <div class="inside"><b>🛖 İglo / Kulübeler</b><span id="cnt-kulube">0 Buzağı</span></div>
      </div>
      <div class="home-card" onclick="openSection('robot')">
        <div class="inside"><b>🤖 Buzağı Robotu</b><span id="cnt-robot">0 Buzağı</span></div>
      </div>
      <div class="home-card" onclick="openSection('hepsi')">
        <div class="inside"><b>📋 Tüm Liste</b><span id="cnt-hepsi">0 Buzağı</span></div>
      </div>
    </div>
    <div class="summary">
      <div class="stats">
        <div class="stat"><strong id="stat-toplam">0</strong><span>Toplam</span></div>
        <div class="stat"><strong id="stat-disi" style="color:var(--green)">0</strong><span>Dişi</span></div>
        <div class="stat"><strong id="stat-erkek" style="color:#a52a2a">0</strong><span>Erkek</span></div>
      </div>
    </div>
  </section>

  <!-- LİSTE SAYFASI -->
  <section id="list-page" class="page">
    <div class="topbar">
      <button class="back" onclick="showPage('home')">←</button>
      <button class="add green" onclick="toggleForm()">+ Yeni Buzağı Ekle</button>
    </div>

    <!-- EKLEME FORMU -->
    <div id="add-form" class="form">
      <h3 style="margin:0 0 10px 0;font-size:16px;">Yeni Buzağı Kaydı</h3>
      <div class="grid2">
        <div class="field"><label>KÜPE NO</label><input id="inp-kupe" placeholder="TR..." required></div>
        <div class="field"><label>BÖLÜM</label>
          <select id="inp-grup">
            <option value="bolme">Bireysel Bölme</option>
            <option value="kulube">Kulübe / İglo</option>
            <option value="robot">Buzağı Robotu</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>CİNSİYET</label>
          <select id="inp-cinsiyet">
            <option value="Dişi">Dişi</option>
            <option value="Erkek">Erkek</option>
          </select>
        </div>
        <div class="field"><label>DOĞUM TARİHİ</label><input type="date" id="inp-dogum"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>ANNE KÜPE</label><input id="inp-anne" placeholder="TR..."></div>
        <div class="field"><label>BABA IRKI / NO</label><input id="inp-baba" placeholder="Simental..."></div>
      </div>
      <div class="field"><label>DOĞUM KİLOSU (KG)</label><input type="number" id="inp-kilo" placeholder="40"></div>
      <button class="primary green" onclick="saveBuzagi()">Buluta Kaydet</button>
    </div>

    <input id="search-box" class="filter" placeholder="🔍 Küpe No ile ara..." oninput="renderList()">
    <div id="buzagi-list" class="list"></div>
  </section>
</main>

<!-- İŞLEM / SAĞLIK MODAL -->
<div id="action-modal" class="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="modal-title" style="margin:0">İşlem Ekle</h3>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="field"><label>İŞLEM TÜRÜ</label>
      <select id="act-type">
        <option value="Aşı">Aşı Uygulaması</option>
        <option value="Tedavi">Tedavi / İlaç</option>
        <option value="Tartım">Kilo Tartımı</option>
      </select>
    </div>
    <div class="field"><label>AÇIKLAMA / İLAÇ / KİLO</label><input id="act-detail" placeholder="Örn: 2ml Rota-Korona veya 65 kg"></div>
    <button class="primary" onclick="submitAction()">Kaydet</button>
    <div id="modal-history" style="margin-top:15px;"></div>
  </div>
</div>

<nav class="nav">
  <button id="nav-btn-home" class="active" onclick="showPage('home')">🏠 Ana Menü</button>
  <button id="nav-btn-list" onclick="openSection('hepsi')">📋 Tüm Sürü</button>
</nav>
</div>

<script>
// ================= SUPABASE CLIENT =================
const SUPABASE_URL = "https://anuxloclaxxensuidagd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFudXhsb2NsYXh4ZW5zdWlkYWdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjA5MjUsImV4cCI6MjEwMzY5NjkyNX0.VkjxL8-5VD24FYyysTBGkMBboAZrSp6vEyUg7-ocO9A";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let list = [];
let currentGroup = 'hepsi';
let activeCalfId = null;

async function startApp() {
  document.getElementById('inp-dogum').value = new Date().toISOString().split('T')[0];
  await loadData();

  // Canlı Senkronizasyon (Telefon ↔ PC anında güncellenir)
  db.channel('realtime:buzagilar')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'buzagilar' }, () => {
      loadData();
    })
    .subscribe();
}

async function loadData() {
  const { data, error } = await db.from('buzagilar').select('*').order('created_at', { ascending: false });
  if (!error && data) {
    list = data;
    updateCounts();
    renderList();
  }
}

async function saveBuzagi() {
  const kupe = document.getElementById('inp-kupe').value.trim();
  if (!kupe) return alert('Küpe numarası zorunludur!');

  const item = {
    kupe,
    grup: document.getElementById('inp-grup').value,
    cinsiyet: document.getElementById('inp-cinsiyet').value,
    dogum_tarih: document.getElementById('inp-dogum').value,
    anne_kupe: document.getElementById('inp-anne').value.trim(),
    baba_irk: document.getElementById('inp-baba').value.trim(),
    kilo: parseFloat(document.getElementById('inp-kilo').value) || null,
    asilar: [],
    tedaviler: []
  };

  const { error } = await db.from('buzagilar').insert([item]);
  if (error) {
    alert('Kayıt başarısız: ' + error.message);
  } else {
    document.getElementById('inp-kupe').value = '';
    document.getElementById('inp-anne').value = '';
    document.getElementById('inp-baba').value = '';
    document.getElementById('inp-kilo').value = '';
    toggleForm(false);
    loadData();
  }
}

async function removeCalf(id) {
  if (confirm('Bu buzağıyı silmek istediğinize emin misiniz?')) {
    await db.from('buzagilar').delete().eq('id', id);
    loadData();
  }
}

async function changeGroup(id, curGrup) {
  const map = { 'bolme': 'Bölme', 'kulube': 'Kulübe', 'robot': 'Robot' };
  const target = prompt("Yeni Bölüm Seçin (bolme / kulube / robot):", curGrup);
  if (target && map[target]) {
    await db.from('buzagilar').update({ grup: target }).eq('id', id);
    loadData();
  }
}

function openActionModal(id) {
  activeCalfId = id;
  const c = list.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-title').innerText = `${c.kupe} • İşlem / Tedavi`;
  renderHistory(c);
  document.getElementById('action-modal').classList.add('show');
}

function renderHistory(c) {
  const box = document.getElementById('modal-history');
  const items = [...(c.asilar || []), ...(c.tedaviler || [])];
  if (items.length === 0) {
    box.innerHTML = "<small style='color:var(--muted)'>Kayıtlı işlem yok.</small>";
    return;
  }
  box.innerHTML = "<b>Geçmiş:</b>" + items.map(i => `
    <div style="background:#f7f9fa;padding:6px 10px;border-radius:8px;margin-top:5px;font-size:12px;">
      <b>${i.type} (${i.date}):</b> ${i.detail}
    </div>
  `).join('');
}

async function submitAction() {
  const type = document.getElementById('act-type').value;
  const detail = document.getElementById('act-detail').value.trim();
  if (!detail) return alert('Lütfen açıklama girin!');

  const c = list.find(x => x.id === activeCalfId);
  if (!c) return;

  const payload = { type, detail, date: new Date().toLocaleDateString('tr-TR') };
  let updateObj = {};

  if (type === 'Aşı') updateObj.asilar = [...(c.asilar || []), payload];
  else updateObj.tedaviler = [...(c.tedaviler || []), payload];

  await db.from('buzagilar').update(updateObj).eq('id', activeCalfId);
  document.getElementById('act-detail').value = '';
  closeModal();
  loadData();
}

function updateCounts() {
  document.getElementById('stat-toplam').innerText = list.length;
  document.getElementById('stat-disi').innerText = list.filter(x => x.cinsiyet === 'Dişi').length;
  document.getElementById('stat-erkek').innerText = list.filter(x => x.cinsiyet === 'Erkek').length;
  document.getElementById('cnt-bolme').innerText = list.filter(x => x.grup === 'bolme').length + ' Buzağı';
  document.getElementById('cnt-kulube').innerText = list.filter(x => x.grup === 'kulube').length + ' Buzağı';
  document.getElementById('cnt-robot').innerText = list.filter(x => x.grup === 'robot').length + ' Buzağı';
  document.getElementById('cnt-hepsi').innerText = list.length + ' Buzağı';
}

function renderList() {
  const target = document.getElementById('buzagi-list');
  const q = document.getElementById('search-box').value.toLowerCase();
  let res = currentGroup === 'hepsi' ? list : list.filter(x => x.grup === currentGroup);
  if (q) res = res.filter(x => x.kupe.toLowerCase().includes(q) || (x.anne_kupe && x.anne_kupe.toLowerCase().includes(q)));

  if (res.length === 0) {
    target.innerHTML = '<div class="empty">Bu grupta buzağı bulunamadı.</div>';
    return;
  }

  target.innerHTML = res.map(c => {
    const age = Math.floor((new Date() - new Date(c.dogum_tarih)) / (1000 * 60 * 60 * 24)) || 0;
    return `
      <div class="animal">
        <div class="animal-head">
          <span class="animal-title">🐮 ${c.kupe}</span>
          <span class="badge">${c.cinsiyet} • ${age} Günlük</span>
        </div>
        <div class="details">
          <div class="detail"><small>Grup</small><b>${c.grup.toUpperCase()}</b></div>
          <div class="detail"><small>Doğum Kilosu</small><b>${c.kilo ? c.kilo + ' kg' : '-'}</b></div>
          <div class="detail"><small>Anne Küpe</small><b>${c.anne_kupe || '-'}</b></div>
          <div class="detail"><small>Baba Irkı</small><b>${c.baba_irk || '-'}</b></div>
        </div>
        <div class="actions">
          <button class="move" onclick="openActionModal('${c.id}')">💉 Sağlık / Aşı</button>
          <button class="btn-act" onclick="changeGroup('${c.id}', '${c.grup}')">🔁 Grup Taşı</button>
          <button class="danger" onclick="removeCalf('${c.id}')">Sil</button>
        </div>
      </div>
    `;
  }).join('');
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.getElementById(p === 'home' ? 'home' : 'list-page').classList.add('active');
  document.getElementById('nav-btn-home').classList.toggle('active', p === 'home');
  document.getElementById('nav-btn-list').classList.toggle('active', p !== 'home');
}

function openSection(grp) {
  currentGroup = grp;
  document.getElementById('inp-grup').value = grp === 'hepsi' ? 'bolme' : grp;
  showPage('list-page');
  renderList();
}

function toggleForm(force) {
  const f = document.getElementById('add-form');
  f.classList.toggle('show', force);
}

function closeModal() {
  document.getElementById('action-modal').classList.remove('show');
}

window.addEventListener('DOMContentLoaded', startApp);
</script>
</body>
</html>
